apis:
- name: Lotame Admin Services API
  description: >-
    Token-based REST API for managing first-party data, building and editing
    audience segments, activating audiences, and retrieving behavior and
    audience analytics on the Lotame Spherical platform. JSON over HTTPS with
    GET/PUT/POST/DELETE, versioned under /2/, authenticated with x-lotame-token
    and x-lotame-access header credentials created in the Spherical platform.
  humanURL: https://my.lotame.com/category/administrative-api
  baseURL: https://api.lotame.com/2/
