aid: lotame-solutions
name: Lotame Solutions
description: >-
  Lotame Solutions is a data collaboration and identity company for digital
  marketing and advertising. Its Spherical platform lets marketers, agencies,
  and publishers connect, enrich, and activate first- and third-party audience
  data, while Panorama ID delivers a privacy-first, cookieless identity for
  addressability across web, mobile app, and CTV. Lotame exposes a token-based
  Admin Services REST API (api.lotame.com/2/) for managing first-party data,
  building audiences, and pulling behavior and audience statistics, plus a
  server-side Panorama ID resolution API on sid.crwdcntrl.net for web and
  mobile (MAID) identity lookups. Lotame operates across 24 countries and was
  acquired by Publicis Groupe.
