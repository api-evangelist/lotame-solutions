- name: Panorama ID Server-Side API
  description: >-
    Real-time server-side API that returns the assigned Panorama ID for an IP
    address and user-agent (web) or Mobile Advertiser ID / MAID (mobile app).
    JSON POST to sid.crwdcntrl.net/sid, identified by a Lotame-assigned static
    client_id, with IAB TCF v2 or Lotame consent signaling required per request.
  humanURL: https://my.lotame.com/category/panorama-id-apis
  baseURL: https://sid.crwdcntrl.net/sid
  properties:
