name: Lotame Solutions Client Libraries and Packages
notes: >-
  Lotame publishes its client libraries from the Lotame GitHub organization
  (https://github.com/Lotame). There is NO first-party SDK for the Admin
  Services REST API in any language registry — npm, PyPI, RubyGems, NuGet,
  crates.io and pkg.go.dev return no Lotame-published package. The first-party
  packages that do exist are data-collection SDKs for mobile apps and the
  browser (Crowd Control / Lightning Tag), not API clients. Lotame instead ships
  Python EXAMPLE code (github.com/Lotame/api-examples,
  github.com/Lotame/DataStream_Cookbook) whose own README states it is "an
  example, not an official Lotame-supported tool."
