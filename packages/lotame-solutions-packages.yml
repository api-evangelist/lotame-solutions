  platform: browser
  official: true
  purpose: >-
    First-party browser data collection tag: collects behaviors, sets identity
    (EMAIL / EMAIL_SHA256), reads audiences and returns the Panorama ID.
  version: null
  published: null
  note: >-
    CDN-distributed, and the URL carries NO version segment — it is keyed on the
    customer's own <lotameClientId> and the bundle is, per Lotame's docs,
    "dynamically generated for your implementation" and served from AWS
    CloudFront. There is no registry metadata endpoint and no pinnable version,
    so a consumer cannot determine which build they are executing. Recorded as
    null deliberately: checked, nothing to record.
