  platform: iOS
  official: true
  purpose: >-
    Lotame DMP data collection from within an iOS application; also exposes the
    Panorama ID / profile ID to the host app.
  license: MIT
  version: 5.3.0
  published: '2021-07-28'
  note: >-
    Latest version published to the CocoaPods trunk is 5.3.0 (2021-07-28), seven
