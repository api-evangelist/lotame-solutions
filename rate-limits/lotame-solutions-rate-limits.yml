note: >-
  Lotame CONFIRMS that rate limits exist but publishes no numbers. The Admin
  Services API article states verbatim: "There are limits in place on api
  endpoints to ensure platform stability. Submit a Support ticket form through
  this link if you believe you are hitting platform limits." No quota, window,
  burst, per-key vs per-account scope, response header, or exhaustion status
  code is documented anywhere in the knowledge base, and the Swagger explorer at
  https://api.lotame.com/docs/ that might carry them is behind SAML
  authentication. An integrator therefore has no runtime signal to back off on
  and no documented number to design against — the only published remedy is a
  human support ticket. Recorded as an honest zero, not an absence of checking.
